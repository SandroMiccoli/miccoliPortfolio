    <title>Three.js Hello World</title>

    <script id="vertexShader" type="x-shader/x-vertex">
        // @author brunoimbrizi / http://brunoimbrizi.com

        precision highp float;

        attribute float pindex;
        attribute vec3 position;
        attribute vec3 offset;
        attribute vec2 uv;
        attribute float angle;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;

        uniform float uTime;
        uniform float uRandom;
        uniform float uDepth;
        uniform float uSize;
        uniform vec2 uTextureSize;
        uniform sampler2D uTexture;
        uniform sampler2D uTouch;

        varying vec2 vPUv;
        varying vec2 vUv;

        // thanks to: https://gist.github.com/patriciogonzalezvivo/670c22f3966e662d2f83
        // Simplex 2D noise
        //
        vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }

        float snoise(vec2 v){
          const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                   -0.577350269189626, 0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy) );
          vec2 x0 = v -   i + dot(i, C.xx);
          vec2 i1;
          i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod(i, 289.0);
          vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
          + i.x + vec3(0.0, i1.x, 1.0 ));
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
            dot(x12.zw,x12.zw)), 0.0);
          m = m*m ;
          m = m*m ;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
          vec3 g;
          g.x  = a0.x  * x0.x  + h.x  * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }
        float random(float n) {
            return fract(sin(n) * 43758.5453123);
        }

        void main() {
            vUv = uv;

            // particle uv
            vec2 puv = offset.xy / uTextureSize;
            vPUv = puv;

            // pixel color
            vec4 colA = texture2D(uTexture, puv);
            float grey = colA.r * 0.21 + colA.g * 0.71 + colA.b * 0.07;

            // displacement
            vec3 displaced = offset;
            // randomise
            displaced.xy += vec2(random(pindex) - 0.5, random(offset.x + pindex) - 0.5) * uRandom;
            float rndz = (random(pindex) + snoise(vec2(pindex * 0.1, uTime * 0.1)));
            displaced.z += rndz * (random(pindex) * 2.0 * uDepth);
            // center
            displaced.xy -= uTextureSize * 0.5;

            // touch
            float t = texture2D(uTouch, puv).r;
            displaced.z += t * 20.0 * rndz;
            displaced.x += cos(angle) * t * 20.0 * rndz;
            displaced.y += sin(angle) * t * 20.0 * rndz;

            // particle size
            float psize = (snoise(vec2(uTime, pindex) * 0.5) + 2.0);
            psize *= max(grey, 0.2);
            psize *= uSize;

            // final position
            vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);
            mvPosition.xyz += position * psize;
            vec4 finalPosition = projectionMatrix * mvPosition;

            gl_Position = finalPosition;
        }
    </script>

    <!-- Fragment Shader -->
    <script id="fragmentShader" type="x-shader/x-fragment">
        // @author brunoimbrizi / http://brunoimbrizi.com

        precision highp float;

        uniform sampler2D uTexture;

        varying vec2 vPUv;
        varying vec2 vUv;

        void main() {
            vec4 color = vec4(0.0);
            vec2 uv = vUv;
            vec2 puv = vPUv;

            // pixel color
            vec4 colA = texture2D(uTexture, puv);

            // greyscale
            float grey = colA.r * 0.21 + colA.g * 0.71 + colA.b * 0.07;
            vec4 colB = vec4(grey, grey, grey, 1.0);

            // circle
            float border = 0.3;
            float radius = 0.5;
            float dist = radius - distance(uv, vec2(0.5));
            float t = smoothstep(0.0, border, dist);

            // final color
            color = colB;
            color.a = t;

            gl_FragColor = color;
        }
    </script>


    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.172.0/three.module.min.js';

        const DEBUG = true;


        // Initialize scene, camera, and renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

      
        if(DEBUG)
          scene.add(new THREE.AxesHelper(1));

        // Set camera position
        camera.position.z = 2;

        // Create instanced geometry
        const geometry = new THREE.InstancedBufferGeometry();

        // positions
        const positions = new THREE.BufferAttribute(new Float32Array(4 * 3), 3);
        positions.setXY(0, -0.5, 0.5, 0.0);
        positions.setXY(1, 0.5, 0.5, 0.0);
        positions.setXY(2, -0.5, -0.5, 0.0);
        positions.setXY(3, 0.5, -0.5, 0.0);
        geometry.setAttribute('position', positions);

        // uvs
        const uvs = new THREE.BufferAttribute(new Float32Array(4 * 2), 2);
        uvs.setXY(0, 0.0, 0.0);
        uvs.setXY(1, 1.0, 0.0);
        uvs.setXY(2, 0.0, 1.0);
        uvs.setXY(3, 1.0, 1.0);
        geometry.setAttribute('uv', uvs);

        // index
        geometry.setIndex(new THREE.BufferAttribute(new Uint16Array([ 0, 2, 1, 2, 3, 1 ]), 1));

        console.log(geometry);
        console.log(geometry.attributes);

        // Add Instanced Attributes
        const numParticles = 100; // Example: 320x180 image
        const indices = new Uint16Array(numParticles);
        const offsets = new Float32Array(numParticles * 3);
        const angles = new Float32Array(numParticles);

        for (let i = 0; i < numParticles; i++) {
          offsets[i * 3] = (i % 535) - 267; // X offset
          offsets[i * 3 + 1] = Math.floor(i / 664) - 332; // Y offset
          offsets[i * 3 + 2] = 0; // Z offset

          indices[i] = i;

          angles[i] = Math.random() * Math.PI; // Random angle
        }

        geometry.setAttribute('pindex', new THREE.InstancedBufferAttribute(indices, 1, false));
        geometry.setAttribute('offset', new THREE.InstancedBufferAttribute(offsets, 3));
        geometry.setAttribute('angle', new THREE.InstancedBufferAttribute(angles, 1));

        // Shader Material
        const uniforms = {
          uTime: { value: 0 },
          uRandom: { value: 1.0 },
          uDepth: { value: 2.0 },
          uSize: { value: 1.0 },
          uTextureSize: { value: new THREE.Vector2(535, 664) },
          uTexture: { value: new THREE.TextureLoader().load("{{ 'wip/' | relative_url }}v3/img001.jpeg",
            (texture) => {
              uniforms.uTexture.value = texture;
              console.log('Texture successfully loaded', texture);
            },
            undefined,
            (err) => {
              console.error('Error loading texture', err);
            })},
          uTouch: { value: null },
        };

        const material = new THREE.RawShaderMaterial({
          uniforms,
          vertexShader: document.getElementById('vertexShader').textContent,
          fragmentShader: document.getElementById('fragmentShader').textContent,
          depthTest: true,
          transparent: true,
        });
        
        const mesh = new THREE.Mesh(geometry, material);

        const textureMaterial = new THREE.MeshBasicMaterial({ map: uniforms.uTexture.value });
        // const debugMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });

        // const testMaterial = new THREE.MeshBasicMaterial({ map: uniforms.uTexture.value });
        // mesh.material = debugMaterial;
        mesh.material = textureMaterial;
        // mesh.material.depthTest = true;
        // mesh.material.transparent = true;


        const boxHelper = new THREE.BoxHelper(mesh, 0xffff00);
        scene.add(boxHelper);
          
        mesh.scale.set(0.1, 0.1, 0.1); // Scale down for testing
        console.log("Ensure bounds are within view")
        console.log(mesh.geometry.boundingBox); // Ensure bounds are within view
        mesh.renderOrder = 2;

        scene.add(mesh);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            uniforms.uTime.value += 0.05;

            // mesh.rotation.x += 0.01;
            // mesh.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        animate();

        console.log(renderer.info); // Logs render statistics

        // Handle Window Resize
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
