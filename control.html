<!DOCTYPE html>
<html lang="en" class="synth-html--control">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#101010">
	<title>Visual Synth Control</title>
	<link rel="stylesheet" href="style.css">
</head>
<body class="synth-body synth-control">
	<header class="synth-chrome">
		<div class="synth-chrome__inner">
			<h1 class="synth-chrome__title">Visual Synth</h1>
			<p id="sync-status" class="synth-status">Connecting</p>
		</div>
	</header>
	<main id="ui-root" class="synth-panel is-open is-page" aria-label="Visual Synth PIPEs"></main>

	<script src="icons.js"></script>
	<script src="notify.js"></script>
	<script src="core/registry.js"></script>
	<script src="operators/lines.js"></script>
	<script src="operators/warp.js"></script>
	<script src="operators/lookup.js"></script>
	<script src="operators/bloom.js"></script>
	<script src="operators/screen.js"></script>
	<script src="operators/placeholders.js"></script>
	<script src="core/pipeline.js"></script>
	<script src="core/pipes.js"></script>
	<script src="state.js"></script>
	<script src="ui.js"></script>
	<script src="sync.js"></script>
	<script src="control.js"></script>
</body>
</html>
