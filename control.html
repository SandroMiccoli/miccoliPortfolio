<!DOCTYPE html>
<html lang="en" class="synth-html--control">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#101010">
	<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
	<link rel="manifest" href="/images/favicon/site.webmanifest">
	<link rel="shortcut icon" href="/images/favicon/favicon.ico">
	<title>ELO Control</title>
	<link rel="stylesheet" href="style.css">
</head>
<body class="synth-body synth-control">
	<header class="synth-chrome">
		<div class="synth-chrome__inner">
			<div class="synth-chrome__copy">
				<h1 class="synth-chrome__title">ELO</h1>
				<p id="sync-status" class="synth-status is-wait">Connecting</p>
			</div>
			<div id="synth-help-slot" class="synth-chrome__help"></div>
		</div>
		<div id="synth-sys-slot" class="synth-chrome__sys"></div>
	</header>
	<main id="ui-root" class="synth-panel is-open is-page" aria-label="ELO"></main>

	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
