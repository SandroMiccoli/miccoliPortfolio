site: Lab

url: lab.sandromiccoli.com
baseurl: 

collections:
  pages:
    output: true
    permalink: /:name
  experiments:
    output: true
    permalink: /:slug/

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "lab-home"
  -
    scope:
      path: ""
      type: "experiments"
    values:
      layout: "lab-experiment"

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  
sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Lab site configuration
github_repo: https://github.com/SandroMiccoli/miccoliPortfolio/
site_title: Lab
site_description: Creative coding experiments and explorations by Sandro Miccoli

# Default Open Graph image (uses favicon)
image: /images/favicon/favicon.png