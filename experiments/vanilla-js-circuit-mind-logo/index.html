<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
  <link rel="manifest" href="/images/favicon/site.webmanifest">
  <link rel="shortcut icon" href="/images/favicon/favicon.ico">
  <title>Vanilla JS — Circuit Mind Logo</title>
  <meta name="description" content="The Circuit Mind mark and an Orbitron 404 drawn as open circuit traces, with a light traveling each path.">
  <link rel="stylesheet" href="css/circuit-mind.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cm-demo">
    <div class="cm-demo__board">
      <div class="cm-demo__stage cm-demo__stage--logo" id="cm-stage-logo">
        <div id="cm-logo">
          <img
            class="cm-demo__ref"
            id="cm-ref"
            src="assets/logo-reference.png"
            alt=""
            width="327"
            height="310"
            draggable="false"
          >
        </div>
      </div>
      <div class="cm-demo__stage cm-demo__stage--404 is-off" id="cm-stage-404" aria-hidden="true" inert>
        <div id="cm-404"></div>
      </div>
    </div>
    <div class="cm-demo__switchers">
      <div class="cm-demo__versions" role="tablist" aria-label="Scene">
        <button type="button" id="cm-scene-logo" role="tab" aria-selected="true" aria-controls="cm-stage-logo">Logo</button>
        <button type="button" id="cm-scene-404" role="tab" aria-selected="false" aria-controls="cm-stage-404" tabindex="-1">404</button>
      </div>
      <button type="button" id="cm-export-status" class="cm-demo__export" aria-live="polite" hidden disabled></button>
    </div>
  </div>
  <noscript><p class="cm-demo__error">This page needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
