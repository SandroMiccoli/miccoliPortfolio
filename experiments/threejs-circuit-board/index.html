<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
	<link rel="manifest" href="/images/favicon/site.webmanifest">
	<link rel="shortcut icon" href="/images/favicon/favicon.ico">
	<title>Three.js — Circuit Board</title>
	<meta name="description" content="A PCB study in three layers. Switch between a 3D arm, a 3D airframe, a 3D satellite, and a 3D data center.">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="circuit-board">
		<header>
			<div class="brand"><i></i>CIRCUIT MIND<span id="study-label">3D ROBOTIC ARM</span></div>
			<div class="tools">
				<button type="button" id="reset">Reset zoom</button>
			</div>
		</header>
		<main id="stage" tabindex="0" aria-label="Circuit board. Move the pointer to tilt. Scroll to zoom. R resets the zoom."></main>
		<div id="error" hidden>WebGL is unavailable. Please enable hardware acceleration.</div>
		<nav aria-label="Study">
			<button type="button" data-mode="arm" aria-pressed="true">3D Robotic Arm</button>
			<button type="button" data-mode="plane" aria-pressed="false">3D Plane</button>
			<button type="button" data-mode="satellite" aria-pressed="false">3D Satellite</button>
			<button type="button" data-mode="datacenter" aria-pressed="false">3D Data Center</button>
		</nav>
		<aside class="layers">
			<span>03 <b>REAL-WORLD TECHNOLOGY</b><small id="layer-tech">Industrial arm · hologram</small></span>
			<span>02 <b>AI INTELLIGENCE</b><small>Processing grid</small></span>
			<span>01 <b>PHYSICAL FOUNDATION</b><small>PCB board</small></span>
		</aside>
		<footer>
			<span><b></b>BOARD DESIGN STUDY</span>
			<p>Move to tilt <em>·</em> Scroll to zoom</p>
			<span class="edition">THREE LAYERS</span>
		</footer>
	</div>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
		}
	}
	</script>
	<script type="module" src="main.js"></script>
</body>
</html>
