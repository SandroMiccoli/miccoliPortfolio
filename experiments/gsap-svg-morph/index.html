<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
	<link rel="manifest" href="/images/favicon/site.webmanifest">
	<link rel="shortcut icon" href="/images/favicon/favicon.ico">
	<title>GSAP SVG Morph</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="page">
		<div class="stage">
			<div class="version-switch" role="group" aria-label="Animation version">
				<button type="button" class="version-card is-active" data-version="v1" aria-pressed="true">V1</button>
				<button type="button" class="version-card" data-version="v2" aria-pressed="false">V2</button>
			</div>

			<section class="morph-card" aria-label="Interactive feature showcase">
			<div class="morph-card__copy">
				<ul class="option-list" role="list">
					<li>
						<button class="option is-active" type="button" data-index="0" aria-pressed="true">
							<span class="option__title">Cluster Logic</span>
							<span class="option__desc">Group related signals so the system reads as one coherent form.</span>
						</button>
					</li>
					<li>
						<button class="option" type="button" data-index="1" aria-pressed="false">
							<span class="option__title">Signal Grid</span>
							<span class="option__desc">Scan a field of nodes and isolate the one that matters most.</span>
						</button>
					</li>
					<li>
						<button class="option" type="button" data-index="2" aria-pressed="false">
							<span class="option__title">Nested Focus</span>
							<span class="option__desc">Move inward through layers until the subject sits dead center.</span>
						</button>
					</li>
					<li>
						<button class="option" type="button" data-index="3" aria-pressed="false">
							<span class="option__title">Linked Path</span>
							<span class="option__desc">Trace a sequence of connections from one state into the next.</span>
						</button>
					</li>
				</ul>

				<div class="option-indicator" aria-hidden="true">
					<span class="option-indicator__dot">
						<svg viewBox="0 0 24 24" width="12" height="12" fill="none">
							<path d="M9 6l6 6-6 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
					</span>
				</div>

				<a class="morph-cta" href="#" onclick="return false;">Explore the system</a>
			</div>

			<div class="morph-card__visual" aria-hidden="true">
				<canvas class="morph-bg-canvas" id="metaball-canvas"></canvas>
				<svg class="morph-svg" id="svg-stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

					</defs>

					<path id="morph-gap" class="morph-gap" d="M50 50h0.01v0.01H50z" opacity="0"/>
				</svg>
			</div>
		</section>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MorphSVGPlugin.min.js"></script>
	<script type="module" src="main.js"></script>
</body>
</html>
