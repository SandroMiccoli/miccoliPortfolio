# Installed by elo-net setup to /etc/NetworkManager/dnsmasq-shared.d/elo.conf
# Only active when elo-ap (ipv4.method shared) is up.

# Resolve any hostname to the Pi gateway (captive portal).
address=/#/10.42.0.1

# RFC 8910 captive portal URI (Android 11+, iOS 14+).
dhcp-option=114,http://10.42.0.1/control
