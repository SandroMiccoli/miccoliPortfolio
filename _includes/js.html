  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=5f48f7188f74bb2244aba6cc" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <script src="/assets/js/isotope.pkgd.min.js" type="text/javascript"></script>
  <script src="/assets/js/webflow.js" type="text/javascript"></script>
  <script type="text/javascript">

    function goToTop() {
      currentYOffset = self.pageYOffset;
      initYOffset = currentYOffset;

      var intervalId = setInterval(function(){
      currentYOffset -= initYOffset*0.05; 
      document.body.scrollTop = currentYOffset ;
      document.documentElement.scrollTop = currentYOffset;

        if(self.pageYOffset == 0){
          clearInterval(intervalId);
        }
      }, 20);
    }
    
    $(window).bind("load", function() {
        $('#loading').hide(); // Hides loading page
        var $grid = $('.home-projectlist-wrapper').isotope({
          itemSelector: '.home-project-wrapper',
          resizeable:false,
          layoutMode: 'vertical',
          // percentPosition: true,
          hiddenStyle: {
            opacity: 0
          },
          visibleStyle: {
            opacity: 1
          },
          transitionDuration: '0.8s'

        });

          $('.home-categories-wrapper').on( 'click', 'a', function() {
            var filterValue = $( this ).attr('data-filter');
            $grid.isotope({ filter: filterValue });
            goToTop();
          });
    });

  </script>
