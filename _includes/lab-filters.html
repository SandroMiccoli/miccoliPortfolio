<div class="lab-filters">
	<div class="lab-filters__search">
		<input type="text" 
		       id="lab-search-input" 
		       class="lab-filters__search-input" 
		       placeholder="Search experiments...">
	</div>
	
	<div class="lab-filters__tags" id="lab-tag-filters">
		<button class="lab-filters__tag-btn" data-tag="all">All</button>
		<button class="lab-filters__tag-btn" data-tag="gsap">GSAP</button>
		<button class="lab-filters__tag-btn" data-tag="p5js">p5.js</button>
		<button class="lab-filters__tag-btn" data-tag="threejs">Three.js</button>
		<button class="lab-filters__tag-btn" data-tag="webgl">WebGL</button>
		<button class="lab-filters__tag-btn" data-tag="ui">UI</button>
		<button class="lab-filters__tag-btn" data-tag="typography">Typography</button>
		<button class="lab-filters__tag-btn" data-tag="data-viz">Data Viz</button>
		<button class="lab-filters__tag-btn" data-tag="ai-images">AI Images</button>
		<button class="lab-filters__tag-btn" data-tag="shaders">Shaders</button>
		<button class="lab-filters__tag-btn" data-tag="interactive">Interactive</button>
	</div>
	
	<button class="lab-filters__clear" id="lab-clear-filters">Clear</button>
</div>
