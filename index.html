<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#101010">
	<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
	<link rel="manifest" href="/images/favicon/site.webmanifest">
	<link rel="shortcut icon" href="/images/favicon/favicon.ico">
	<title>Visual Synth</title>
	<link rel="stylesheet" href="style.css">
</head>
<body class="synth-body synth-display">
	<div id="app" class="synth-stage"></div>

	<button type="button" id="synth-handle" class="synth-handle" hidden aria-hidden="true"></button>

	<aside id="ui-root" class="synth-panel" aria-label="Visual Synth PIPEs"></aside>

	<button type="button" id="qr-btn" class="synth-qr-btn" hidden aria-label="Show access QR code">QR</button>

	<div id="debug-hud" class="synth-debug-hud" hidden>
		<div>FPS <span id="debug-fps" class="synth-meter">-</span></div>
		<div>CPU <span id="debug-temp" class="synth-meter">-</span></div>
	</div>

	<div id="boot-overlay" class="synth-boot" hidden>
		<div class="synth-boot__card">
			<h1 class="synth-boot__title">Synth</h1>
			<p id="boot-url" class="synth-boot__url">http://visual-synth.local:8080</p>
			<div id="boot-qr" class="synth-boot__qr"></div>
			<p class="synth-boot__hint">Scan to control from your phone</p>
		</div>
	</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
	<script src="icons.js"></script>
	<script src="notify.js"></script>
	<script src="shaders.js"></script>
	<script src="core/registry.js"></script>
	<script src="camera.js"></script>
	<script src="operators/lines.js"></script>
	<script src="operators/noise.js"></script>
	<script src="operators/shape.js"></script>
	<script src="operators/gradient.js"></script>
	<script src="operators/camera.js"></script>
	<script src="operators/warp.js"></script>
	<script src="operators/lookup.js"></script>
	<script src="operators/bloom.js"></script>
	<script src="operators/kaleidoscope.js"></script>
	<script src="operators/edge.js"></script>
	<script src="operators/displace.js"></script>
	<script src="operators/blur.js"></script>
	<script src="operators/feedback.js"></script>
	<script src="operators/screen.js"></script>
	<script src="operators/placeholders.js"></script>
	<script src="core/pipeline.js"></script>
	<script src="core/pipes.js"></script>
	<script src="core/clock.js"></script>
	<script src="core/modulate.js"></script>
	<script src="core/fft.js"></script>
	<script src="core/output.js"></script>
	<script src="core/presets.js"></script>
	<script src="state.js"></script>
	<script src="core/executor.js"></script>
	<script src="engine.js"></script>
	<script src="ui.js"></script>
	<script src="output-overlay.js"></script>
	<script src="sync.js"></script>
	<script src="main.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</body>
</html>
